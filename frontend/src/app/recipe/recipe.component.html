<div class="recipe-form">
  <h2>{{ isEditing ? 'Edit Recipe' : 'Create Recipe' }}</h2>

 
  <label for="recipeName">Recipe Name:</label>
  <input id="recipeName" type="text" (input)="setRecipeName($event)" placeholder="Enter recipe name" />

  <label for="spice">Select Spice:</label>
  <select id="spice" (change)="selectSpice($event)">
    <option value="" disabled selected>--Select a Spice--</option>
    <option *ngFor="let spice of spiceOptions" [value]="spice">{{ spice }}</option>
  </select>


  <label for="measurement">Select Measurement:</label>
  <select id="measurement" (change)="selectMeasurement($event)">
    <option value="" disabled selected>--Select a Measurement--</option>
    <option *ngFor="let measurement of measurementOptions" [value]="measurement">{{ measurement }}</option>
  </select>


  <button (click)="addIngredient()">Add Ingredient</button>

 
  <ul>
    <li *ngFor="let ingredient of currentRecipe.ingredients; let i = index">
      {{ ingredient.spice }} - {{ ingredient.measurement }}
      <button (click)="removeIngredient(i)">Remove</button>
    </li>
  </ul>

  
  <button (click)="saveOrUpdateRecipe()">{{ isEditing ? 'Update Recipe' : 'Save Recipe' }}</button>

 
  <button (click)="goBack()">Back</button>
</div>


<div class="recipe-list">
  <h2>Saved Recipes</h2>
  <ul>
    <li *ngFor="let recipe of recipes">
      <strong>{{ recipe.name }}</strong>
      <button (click)="editRecipe(recipe)">Edit</button>
      <button (click)="deleteRecipe(recipe)">Delete</button>
      <ul>
        <li *ngFor="let ingredient of recipe.ingredients">
          {{ ingredient.spice }} - {{ ingredient.measurement }}
        </li>
      </ul>
    </li>
  </ul>
</div>
