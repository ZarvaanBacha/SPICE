<div class="signin-container">
    <h2>Sign In</h2>
    <form>
        <div class="form-group">
            <label for="username">Email</label>
            <input type="text" id="email" name="email" #email required [class.input-error]="emailErrorFlag">
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" #password required [class.input-error]="passwordErrorFlag">
        </div>
        <input class="btn-primary" type="button" name="submit" value="Submit" (click)="onSubmit(email.value, password.value)">
      </form>
    <a href="signup" class="signup-link">Don't have an account? Sign up</a>
    <img src="\shaker_parts.png" alt="">
</div>


<div *ngIf="toastVisible" class="toast">
    {{this.toastText}}
</div>
