<div class="container">
    <div class="form-container">
        <h1>Add Device</h1>
        <div>
            <label for="productID">Product ID:</label>
            <input type="search" id="productID" name="productID" placeholder="Enter Product ID" #productID required>

        </div>
    </div>
</div>
